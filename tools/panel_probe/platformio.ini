; Panel bring-up probe — Heltec V4 + bare 2.8" 240x320 SPI module (ILI9341 + XPT2046).
;
; Standalone throwaway project: does NOT touch the WADAMESH build. Flash an env,
; look at the screen, delete this folder once the panel is confirmed.
;
;   pio run -d tools/panel_probe -e probe_ili9341       -t upload -t monitor
;   pio run -d tools/panel_probe -e probe_st7789        -t upload -t monitor
;   pio run -d tools/panel_probe -e probe_ili9341_touch -t upload -t monitor
;
; Whichever display env draws clean bars is your controller. The _touch env adds
; TFT_eSPI's built-in XPT2046 support and streams raw + mapped coordinates, which
; is the calibration data the real driver will need.

[platformio]
boards_dir = ../../boards
default_envs = probe_ili9341

[probe_base]
platform = platformio/espressif32@6.11.0
framework = arduino
board = heltec_v4
; The board JSON declares variant "heltec_v4"; point the core at the repo's
; local variants/ shim so pins_arduino.h resolves without pulling the repo's
; variant .cpp files into the framework build.
board_build.variants_dir = variants
monitor_speed = 115200
; ESP32-S3 native USB: asserting DTR/RTS on port open is the download-mode
; trigger, and the latch survives reset (only a power cycle clears it).
; Keep both deasserted so opening a monitor never bricks the session.
monitor_dtr = 0
monitor_rts = 0
lib_deps = bodmer/TFT_eSPI @ ^2.5.43
build_flags =
  ; REQUIRED on ESP32-S3. TFT_eSPI_ESP32_S3.h's raw register macros feed SPI_PORT
  ; into IDF's SPI_USER_REG(i)/REG_SPI_BASE(i), which only resolve for i>=2. With
  ; neither USE_*SPI_PORT set it falls back to SPI_PORT=FSPI -- the *Arduino* enum
  ; (0 on S3), not the IDF host index -- so _spi_user lands at 0x10 and the first
  ; writecommand() in init() panics with StoreProhibited. Same crash and same fix
  ; the repo documents for the T-Lora Pager env in ../../platformio.ini.
  -D USE_FSPI_PORT=1
  -D USER_SETUP_LOADED=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  ; --- Heltec V4 TFT pads (same six signals the V4's own panel uses) ---
  -D TFT_CS=15
  -D TFT_DC=16
  -D TFT_SCLK=17
  -D TFT_MOSI=33
  -D TFT_RST=18
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=1
  ; Conservative for flying leads. The V4's own panel runs 80 MHz on PCB traces;
  ; raise this only once the picture is stable.
  ; 4 MHz: slow enough that unshielded jumper wires cannot corrupt the bus.
  ; Raise once the picture is proven; the panel itself is good for 40-80 MHz
  ; on PCB traces. Touch runs at 2.5 MHz and has been flawless throughout,
  ; which is what pointed at clock rate rather than wiring.
  -D SPI_FREQUENCY=27000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1

; ---------------------------------------------------------------------------
; Display-only envs. Six wires, no MISO. Leave the module's SDO and every T_*
; pin unconnected.
; ---------------------------------------------------------------------------
[env:probe_ili9341]
extends = probe_base
; TFT_MISO must be a pin DISTINCT from TFT_MOSI. TFT_eSPI rewrites -1 to
; TFT_MOSI on S3 (see TFT_eSPI_ESP32_S3.h), which binds GPIO33 as both the
; SPI input and output -- the panel then gets no usable MOSI and stays white.
; GPIO40 is free and already carries T_DO; nothing on the display uses it.
build_flags = ${probe_base.build_flags} -D TFT_MISO=40 -D ILI9341_DRIVER=1

[env:probe_st7789]
extends = probe_base
build_flags = ${probe_base.build_flags} -D TFT_MISO=40 -D ST7789_DRIVER=1 -D TFT_RGB_ORDER=TFT_RGB

; ---------------------------------------------------------------------------
; Display + XPT2046 resistive touch. Two extra wires:
;
;   T_DO  -> GPIO 40      (MISO)
;   T_CS  -> GPIO 41
;
; T_CLK and T_DIN share the display's SCK (17) and MOSI (33) — already wired.
; T_IRQ is not needed; TFT_eSPI polls.
;
; Leave the DISPLAY's SDO pin unconnected. TFT_eSPI drives display and touch off
; one MISO line, and the ILI9341's SDO does not reliably tri-state on these
; modules — tying both DO pins together is the classic source of flaky reads.
; Touch is the only thing that needs to talk back, so give it the line alone.
;
; XPT2046 will not tolerate the display's clock rate; it gets its own.
; ---------------------------------------------------------------------------
[env:probe_ili9341_touch]
extends = probe_base
build_flags =
  ${probe_base.build_flags}
  -D ILI9341_DRIVER=1
  -D TFT_MISO=40
  -D TOUCH_CS=41
  -D SPI_TOUCH_FREQUENCY=2500000

; ---------------------------------------------------------------------------
; Diagnostic env: same wiring as probe_ili9341, but routes Serial to the
; ESP32-S3's HARDWARE USB-Serial-JTAG (ARDUINO_USB_MODE=1) instead of TinyUSB.
; That is the same endpoint the ROM and the panic handler write to, so a guru
; meditation / backtrace actually reaches us. CORE_DEBUG_LEVEL=5 adds the
; core's own logging. Use this to diagnose, not to run.
; ---------------------------------------------------------------------------
[env:probe_diag]
extends = probe_base
build_flags =
  ${probe_base.build_flags}
  -D TFT_MISO=40
  -D ILI9341_DRIVER=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=5
